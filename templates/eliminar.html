{% extends 'base.html' %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white text-center">
                <h4 class="mb-0">⚠️ Confirmar Eliminación</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar este instrumento?</p>
                <h3 class="fw-bold">{{ producto.nombre }}</h3>
                <p class="text-muted mb-0">Esta acción no se puede deshacer.</p>
            </div>
            <div class="card-footer d-flex justify-content-center gap-3">
                <form action="/products/{{ producto._id }}/delete" method="POST">
                    <button type="submit" class="btn btn-danger fw-bold">Sí, Eliminar</button>
                </form>
                <a href="/products" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
