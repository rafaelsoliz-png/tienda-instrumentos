{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2 class="mb-4">Editar Instrumento</h2>
        <div class="card shadow-sm border-warning">
            <div class="card-body">
                <form action="/products/{{ producto._id }}/edit" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Instrumento</label>
                        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" required>{{ producto.descripcion }}</textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Precio ($)</label>
                            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                        </div>
                        <div class="col">
                            <label class="form-label">Stock</label>
                            <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <input type="text" name="categoria" class="form-control" value="{{ producto.categoria }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">URL de la Imagen</label>
                        <input type="text" name="imagen" class="form-control" value="{{ producto.imagen }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning fw-bold">Actualizar Instrumento</button>
                        <a href="/products" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
